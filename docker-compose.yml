# Run with:   docker compose up -d --build
# First run:  docker compose logs -f     (scan the QR code, then Ctrl+C)
services:
  summarizer:
    build: .
    container_name: ai-whatsapp-group-summarizer
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Listen on all interfaces inside the container; the port mapping
      # below still keeps the API reachable from this machine only.
      API_HOST: 0.0.0.0
    ports:
      # Remove "127.0.0.1:" only if you really want the API on every
      # interface; prefer a reverse proxy with HTTPS instead.
      - '127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}'
    shm_size: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - wwebjs_auth:/app/.wwebjs_auth
      - data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  wwebjs_auth:
  data:
